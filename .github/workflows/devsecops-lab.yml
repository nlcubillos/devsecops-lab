name: 🏠 DevSecOps Lab

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: 🔍 Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/ tests/ --format stylish || true
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  sca:
    name: 📦 SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --json > npm-audit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  secret-scan:
    name: 🔐 Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - run: |
          trufflehog filesystem . --only-verified --json > trufflehog-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json

  sast:
    name: 🛡️ SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install semgrep
      - run: |
          semgrep \
            --config=auto \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/javascript \
            --json \
            --output=semgrep-report.json \
            --error \
            . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  build-and-scan:
    name: 🐳 Build & Container Scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, sca, secret-scan, sast]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t devsecops-lab:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-lab:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-report.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.sarif

  iac-scan:
    name: 🏗️ IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install checkov
      - run: |
          checkov \
            --directory ./terraform \
            --framework terraform \
            --output sarif \
            --output-file-path checkov-report.sarif \
            --soft-fail
      - uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.sarif